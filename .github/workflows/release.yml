name: Release to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint:layers
      - run: npm run build
      - run: npm run types

      # Provenance ties the published tarball to this workflow run. For a
      # library that rewrites device firmware, being able to verify where a
      # release came from is worth the extra step.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
